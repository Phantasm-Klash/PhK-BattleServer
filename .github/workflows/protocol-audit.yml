name: Battle Server Protocol Audit

on:
  pull_request:
    paths:
      - "apps/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "CMakeLists.txt"
      - ".github/CODEOWNERS"
      - ".github/workflows/protocol-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  battle-server-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PhK-BattleServer
        uses: actions/checkout@v4
        with:
          path: PhK-BattleServer
      - name: Checkout PhK-Protocol
        uses: actions/checkout@v4
        with:
          repository: Phantasm-Klash/PhK-Protocol
          path: PhK-Protocol
      - name: Run repository checker
        run: python3 PhK-BattleServer/tools/check_battle_server.py
      # Built with CMake rather than a hand-written g++ line.
      #
      # The old line listed seven source files by hand. It worked when the
      # battle core was smaller, then quietly rotted: protocol.cpp pulled in
      # ticket.cpp, which needs the card catalog; server.cpp needs the event
      # reporting and HTTP helpers; simulation.cpp needs the chain log. None of
      # those were in the list, so the job could not link at all.
      #
      # Re-listing the files would only rot again the next time a source gains a
      # dependency. CMake already knows the full source set and its link
      # libraries - including OpenSSL, which the input AEAD needs - so let it
      # drive the build and run the whole suite, not just one test binary.
      - name: Build and test with CMake
        working-directory: PhK-BattleServer
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          cd build && ctest --output-on-failure
      - name: Check whitespace
        working-directory: PhK-BattleServer
        run: git diff --check HEAD
