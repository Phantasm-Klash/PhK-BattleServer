name: Release

# Builds the C++ battle server on a `v*` tag and publishes the executable and
# static core library as a workflow artifact + GitHub Release asset.
# Self-contained: uses the vendored PhK-Protocol manifest.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/phk_battle_server dist/
          cp build/libphk_battle_core.a dist/
          ( cd dist && sha256sum ./* > SHA256SUMS.txt )
          ls -l dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: phk-battle-server-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
