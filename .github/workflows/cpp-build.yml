name: C++ Build & Test

# Self-contained C++ build: the required PhK-Protocol manifest is vendored in
# third_party/phk-protocol/gen/cpp, so no sibling PhK-Protocol checkout is
# needed. See third_party/phk-protocol/README.md.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - ".github/workflows/cpp-build.yml"
  pull_request:
    paths:
      - "apps/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - ".github/workflows/cpp-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: cmake build + ctest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          cmake --version
          ninja --version

      - name: Verify self-contained sources
        run: |
          set -euo pipefail
          # The vendored manifest must be committed.
          test -f third_party/phk-protocol/gen/cpp/phk/v1/manifest.hpp
          # A sibling PhK-Protocol checkout must not be required.
          if [ -e ../PhK-Protocol ]; then
            echo "unexpected sibling PhK-Protocol checkout" >&2
            exit 1
          fi

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja | tee configure.log

      - name: Assert vendored manifest was used
        run: |
          set -euo pipefail
          grep -q "third_party/phk-protocol/gen/cpp" configure.log

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  client-parity:
    name: C++ ↔ TS 运动学对拍
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server
        uses: actions/checkout@v4
        with:
          path: PhK-BattleServer

      - name: Checkout client
        uses: actions/checkout@v4
        with:
          repository: Phantasm-Klash/SpellKard
          path: SpellKard

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Build the server-side diff runner
        run: |
          set -euo pipefail
          cmake -S PhK-BattleServer -B PhK-BattleServer/build -G Ninja
          cmake --build PhK-BattleServer/build --target phk_motion_diff

      - name: Install client dependencies
        working-directory: SpellKard/laya
        run: npm ci

      - name: Compile the client mirror
        working-directory: SpellKard/laya
        run: npx tsc -p tsconfig.test.json

      - name: Compare every tick of every scenario
        env:
          BUILD_DIR: ${{ github.workspace }}/PhK-BattleServer/build
          SK_DIR: ${{ github.workspace }}/SpellKard
        run: bash PhK-BattleServer/tools/tna_coverage/run_parity.sh
